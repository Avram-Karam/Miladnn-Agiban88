<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>درجات الحضور</title><link rel="stylesheet" href="../assets/css/base.css"><link rel="stylesheet" href="../assets/css/classic-conference.css"><style>.wrap{max-width:760px;margin:auto;padding:1rem}.gate,.panel{background:linear-gradient(145deg,rgba(15,23,42,.96),rgba(7,13,25,.98));border:1px solid rgba(34,197,94,.3);border-radius:24px;padding:1.4rem;box-shadow:0 18px 45px rgba(0,0,0,.35)}.gate{text-align:center}.pass{width:100%;max-width:340px;margin:1rem auto;padding:13px 16px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#fff;text-align:center;outline:none}.btn-open{border:0;border-radius:14px;padding:12px 24px;background:linear-gradient(135deg,#15803d,#22c55e);color:#fff;font-weight:900}.score-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:1rem}.score-card{padding:13px;border-radius:15px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;gap:10px}.score-val{font-weight:900;color:#4ade80}.total{text-align:center;margin-top:1rem;padding:1.5rem;border-radius:20px;background:rgba(34,197,94,.08)}.muted{color:#94a3b8;font-size:.82rem}@media(max-width:600px){.score-grid{grid-template-columns:1fr}}</style></head><body><div id="app-navbar-slot"></div><main class="wrap"><section id="gate" class="gate"><h1 class="h4 fw-bold">درجات الحضور</h1><p class="muted">هذا القسم للعرض فقط. تعديل الدرجات يتم من لوحة الأدمن.</p><input id="pass" class="pass" type="password" inputmode="numeric" maxlength="6" placeholder="كلمة المرور"><button class="btn-open" onclick="openAttendance()">فتح القسم</button><div id="err" class="text-danger fw-bold mt-2" style="display:none"></div></section><section id="panel" class="panel" style="display:none"><div class="d-flex justify-content-between align-items-center flex-wrap gap-2"><div><h2 class="h4 fw-bold mb-1">درجات حضور والتزام المجموعة</h2><div id="person" class="muted"></div></div><div class="badge text-bg-success" id="groupBadge">—</div></div><div class="score-grid" id="scoreGrid"></div><div class="total"><div class="muted">إجمالي حضور والتزام المجموعة بعد حساب المتوسط</div><div id="total" style="font-size:2rem;font-weight:900;color:#4ade80">0 / 120</div></div><div class="muted mt-3 text-center">الدرجات يحددها الأدمن فقط.</div></section></main><script src="../assets/js/config.js"></script><script src="../assets/js/data-service.js"></script><script src="../assets/js/scoring.js"></script><script src="../assets/js/core.js"></script><script src="../assets/js/identity.js"></script><script>let attendanceData=null;async function refreshAttendance(){const p=YCScoring.profile();const d=await YCScoring.fetchScorebook();const selectedGroup=p?.group||'';const sum=YCScoring.computeGroupSummary({...d,groups:attendanceData.groups},selectedGroup);document.getElementById('scoreGrid').innerHTML=YCScoring.ATTENDANCE_LABELS.map((n,i)=>`<div class="score-card"><span>${n}</span><span class="score-val">${(sum.attendance.details[i]||0).toFixed(1)} / 15</span></div>`).join('');document.getElementById('total').textContent=`${sum.attendance.earned.toFixed(1)} / 120`;}async function openAttendance(){const password=document.getElementById('pass').value;try{const r=await fetch('/api/admin-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'admin',password})});const j=await r.json().catch(()=>null);if(!r.ok||j?.status!=='success'||!j.token)throw Error(j?.message||'بيانات الدخول غير صحيحة');sessionStorage.setItem('admin_session_token',j.token);document.getElementById('gate').style.display='none';document.getElementById('panel').style.display='block';attendanceData=await DataService.loadConference(true);const p=YCScoring.profile();document.getElementById('person').textContent=p?.name?`الاسم: ${p.name}`:'';document.getElementById('groupBadge').textContent=p?.group||'المجموعة غير محددة';await refreshAttendance();}catch(e){document.getElementById('err').style.display='block';document.getElementById('err').textContent=e.message||'تعذر التحقق من الدخول';}}</script></body></html>
