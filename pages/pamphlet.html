<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>البانفلت</title><link rel="stylesheet" href="../assets/css/base.css"><link rel="stylesheet" href="../assets/css/classic-conference.css"><style>.wrap{max-width:760px;margin:auto;padding:1rem}.gate,.panel{background:linear-gradient(145deg,rgba(15,23,42,.96),rgba(7,13,25,.98));border:1px solid rgba(245,158,11,.3);border-radius:24px;padding:1.4rem;box-shadow:0 18px 45px rgba(0,0,0,.35)}.gate{text-align:center}.pass{width:100%;max-width:340px;margin:1rem auto;padding:13px 16px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#fff;text-align:center;outline:none}.btn-open{border:0;border-radius:14px;padding:12px 24px;background:linear-gradient(135deg,#b45309,#f59e0b);color:#fff;font-weight:900}.score-box{text-align:center;margin-top:1.25rem;padding:2rem;border-radius:22px;background:linear-gradient(135deg,rgba(245,158,11,.14),rgba(124,58,237,.08));border:1px solid rgba(245,158,11,.28)}.score{font-size:4rem;font-weight:900;color:#fbbf24;line-height:1}.muted{color:#94a3b8;font-size:.82rem}</style></head><body><div id="app-navbar-slot"></div><main class="wrap"><section id="gate" class="gate"><h1 class="h4 fw-bold">البانفلت</h1><p class="muted">الدرجة القصوى 50 — هذا القسم للعرض فقط. تعديل الدرجة يتم من لوحة الأدمن.</p><input id="pass" class="pass" type="password" inputmode="numeric" maxlength="6" placeholder="كلمة المرور"><button class="btn-open" onclick="openPamphlet()">فتح القسم</button><div id="err" class="text-danger fw-bold mt-2" style="display:none"></div></section><section id="panel" class="panel" style="display:none"><h2 class="h4 fw-bold">درجة البانفلت</h2><div id="group" class="muted"></div><div class="score-box"><div id="score" class="score">0</div><div class="muted mt-2">درجة من 50 — متوسط المجموعة</div></div><div class="muted text-center mt-3">الدرجة يحددها الأدمن فقط.</div></section></main><script src="../assets/js/config.js"></script><script src="../assets/js/data-service.js"></script><script src="../assets/js/scoring.js"></script><script src="../assets/js/core.js"></script><script src="../assets/js/identity.js"></script><script>let pamphletData=null;async function refreshPamphlet(){const p=YCScoring.profile();const d=await YCScoring.fetchScorebook();const selectedGroup=p?.group||'';const s=YCScoring.computeGroupSummary({...d,groups:pamphletData.groups},selectedGroup);document.getElementById('score').textContent=s.pamphlet.earned.toFixed(1);}async function openPamphlet(){const password=document.getElementById('pass').value;try{const r=await fetch('/api/admin-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'admin',password})});const j=await r.json().catch(()=>null);if(!r.ok||j?.status!=='success'||!j.token)throw Error(j?.message||'بيانات الدخول غير صحيحة');sessionStorage.setItem('admin_session_token',j.token);document.getElementById('gate').style.display='none';document.getElementById('panel').style.display='block';pamphletData=await DataService.loadConference(true);const p=YCScoring.profile();document.getElementById('group').textContent=`المجموعة: ${p?.group||'غير محددة'}`;await refreshPamphlet();}catch(e){document.getElementById('err').style.display='block';document.getElementById('err').textContent=e.message||'تعذر التحقق من الدخول';}}</script></body></html>
